<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>definicion y utilizacion de funciones</title>
</head>
<body>
    <script>
        function iva(precio, iva){
            return precio+(precio*iva/100);
        }

        console.log(iva(100,16));

        //Función por expresión - asignación
        const nose = function iva(precio, iva){
            return precio+(precio*iva/100);
        }

        console.log(nose(100,16));

        /*
            crear una funcion por expresion utilizada como argumento
            esta funcion debera imprimir un saludo junto con el nombre de una persona que se encuentra en la funcion principal

            funcion callback es la utilizada como argumento
            funcion principal recibe la funcion  como argumento

        */

        //ekjemplo de funcion por expresion como argumento
        //funcion principal
        function carlos (callback){
            callback("Carlos");
        }

        //function callback
        carlos(
            function saludo(nombre){
                console.log(`Buenos dias, don ${nombre}`);
            }
        );

        /*
        crear una funcion llamada operar que reciba tres argumentos: dos nuemros y una funcion que indique que operacion debe realizarse con ellos.
        
        la funcion operar debe ejecutar la funcion recibida y mostrar el resultado por consola.
        
        realiza una llamada a operar pasando los numeros 8 y 5, junto con una funcion anonima que calcule la suma de ambos*/

        //funcion principal
        function operar(num1, num2, funci){
            console.log(funci(num1,num2));
        }

        operar(2,4,
            function summ(a,b){
                return a+b;
            }
        );

        operar(2,4,
            function mult(a,b){
                return a*b;
            }
        );

        operar(3,4,
            function elev2(a,b){
                return a**a;
            }
        );


        //funcion flecha
        //crea una funcion que divida dos numeros 
        const dividi = (a,b) => a/b;

        console.log(dividi(1,2));

        //con llaves
        const dividi2 = (a,b) =>{
            return a/b;
        }
        console.log(dividi2(9,3));

        //funcion flecha que triplique un numero
        let trp = n => n**3;
        console.log(trp(2));

        //funcion que te salude por la noche

        var bn = () => console.log("Buenas noches,mama");
        bn();
    </script>
</body>
</html>
